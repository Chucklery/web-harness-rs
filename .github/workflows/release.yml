name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build locked release
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package release archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package-release.sh "${{ matrix.target }}" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create aggregate checksums
        shell: bash
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Render Homebrew formula
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/render-homebrew-formula.sh "$version" "$GITHUB_REPOSITORY" dist dist/web-harness.rb
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/web-harness.rb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/web-harness.rb --generate-notes
          fi
