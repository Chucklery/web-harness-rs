[package]
name = "web-harness"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "A lightweight local Codex-style execution host for ChatGPT Web"
readme = "README.md"
repository = "https://github.com/Chucklery/web-harness-rs"
homepage = "https://github.com/Chucklery/web-harness-rs"
documentation = "https://chucklery.github.io/web-harness-rs/"
rust-version = "1.80"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
sha2 = "0.10"
getrandom = "0.4"
tempfile = "3"
rpassword = "7"

[dev-dependencies]

[[bin]]
name = "web-harness"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

