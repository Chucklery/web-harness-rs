[package]
name = "web-harness"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A lightweight local Codex-style execution host for ChatGPT Web"
readme = "README.md"
rust-version = "1.80"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "web-harness"
path = "src/main.rs"

